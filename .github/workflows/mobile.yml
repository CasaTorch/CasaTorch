# Builds the phone apps on every change to mobile/: an Android debug APK (attached to the run) and an iOS simulator
# build. Store builds are signed on your own Mac / with your own key - see mobile/README.md.
name: Mobile apps
on:
  push: { branches: [main], paths: ["mobile/**", ".github/workflows/mobile.yml"] }
  pull_request: { paths: ["mobile/**", ".github/workflows/mobile.yml"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "mobile-${{ github.ref }}", cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        # cache-provider: basic is the MIT-licensed cache; the default in v6 is a separately licensed component
        # whose terms the upgrade would otherwise accept on the project's behalf.
        with: { gradle-version: "8.14.6", cache-provider: basic }
      - name: Shared screens parse, translations and store texts check
        run: |
          for f in mobile/shell/shell.js mobile/shell/bridge.js mobile/shell/i18n/words.js; do node --check "$f"; done
          node mobile/tools/shell-strings.mjs
          node mobile/tools/store-check.mjs
      - name: Build (debug) and lint
        run: gradle -p mobile/android assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: casatorch-android-debug, path: mobile/android/app/build/outputs/apk/debug/*.apk, retention-days: 14 }
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: brew install xcodegen
      - name: Make the Xcode project
        working-directory: mobile/ios
        run: xcodegen
      - name: Build for the simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -project CasaTorch.xcodeproj -scheme CasaTorch -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -20 | sed 's/^/::error::/'; tail -20 build.log; exit 65; }
          tail -5 build.log
