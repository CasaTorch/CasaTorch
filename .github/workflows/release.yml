# Tag a version (git tag v0.3.0 && git push --tags) to publish everything people download:
#   - the multi-arch image ghcr.io/<owner>/casatorch:<version> and :latest (amd64 PCs/NAS, arm64 Raspberry Pi)
#   - installers attached to the GitHub release under fixed names, which casatorch.com/dl/<name> serves:
#     CasaTorch-Setup-Windows.exe, CasaTorch-macOS.pkg, casatorch_amd64.deb, casatorch_arm64.deb,
#     casatorch-raspberry-pi.img.xz, casatorch-compose.yml, casatorch-unraid.xml
name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
# Least privilege: read-only by default; each job asks only for what it needs (image: push to ghcr.io; publish: create
# the release and read this run's artifacts). Runs only on a pushed tag or by hand - never for pull requests or forks.
permissions: { contents: read }
env:
  # The Node.js used to build (the installers bundle deploy/packaging/fetch-node.sh's pinned version).
  NODE_VERSION: v22.23.4
  CASATORCH_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || 'v0.0.0' }}
jobs:
  image:
    runs-on: ubuntu-24.04
    # packages: push to ghcr.io; id-token: sign the image with cosign (keyless, this workflow's GitHub OIDC identity,
    # logged in the public Rekor transparency log); attestations: attach the SLSA build provenance.
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { digest: "${{ steps.build.outputs.digest }}" }
    env: { IMAGE: "ghcr.io/${{ github.repository_owner }}/casatorch" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
      # Everything below works on the digest the build pushed, never on a tag (a tag can be moved; a digest can't).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (cosign, keyless)
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: cosign sign --yes "$IMAGE@${DIGEST}"
      - name: SBOM of the image (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: casatorch-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOM to the image (signed attestation)
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: cosign attest --yes --type cyclonedx --predicate casatorch-image.cdx.json "$IMAGE@${DIGEST}"
      - name: Build provenance (SLSA), pushed next to the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom-image, path: casatorch-image.cdx.json }

  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: deploy/packaging/bundle.sh dist/bundle && echo "${CASATORCH_VERSION#v}" > dist/bundle/VERSION
      - run: tar czf bundle.tgz -C dist bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: bundle, path: bundle.tgz }
      # The app's software bill of materials (CycloneDX): every package it ships, from the lock file.
      - run: cd app && npm sbom --omit=dev --package-lock-only --sbom-format cyclonedx --sbom-type application > ../casatorch-app.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom-app, path: casatorch-app.cdx.json }

  linux:
    needs: bundle
    runs-on: ubuntu-24.04
    strategy: { matrix: { arch: [amd64, arm64] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: bundle }
      - run: mkdir -p dist && tar xzf bundle.tgz -C dist
      - run: CASATORCH_VERSION=${CASATORCH_VERSION#v} deploy/packaging/linux/build-deb.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "deb-${{ matrix.arch }}", path: "dist/casatorch_${{ matrix.arch }}.deb", compression-level: 0 }

  raspberry-pi:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: deb-arm64, path: dist }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binfmt-support parted e2fsprogs xz-utils
      - run: sudo deploy/packaging/pi/build-image.sh dist/casatorch_arm64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: pi-image, path: dist/casatorch-raspberry-pi.img.xz, compression-level: 0 }

  windows:
    needs: bundle
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    # Signing (optional): Microsoft Artifact Signing. Secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET;
    # variables ARTIFACT_SIGNING_ENDPOINT (e.g. https://wus2.codesigning.azure.net/), ARTIFACT_SIGNING_ACCOUNT,
    # ARTIFACT_SIGNING_PROFILE. Without them the installer is built unsigned, exactly as before.
    # The secrets are given only to the signing step (not to the whole job), so no other step or action sees them.
    steps:
      - id: signing
        env: { AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}" }
        run: echo "enabled=$([ -n "$AZURE_CLIENT_ID" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: bundle }
      - run: mkdir -p dist && tar xzf bundle.tgz -C dist
      - run: deploy/packaging/fetch-node.sh win-x64 dist/node-win
      - run: choco install innosetup --no-progress -y
      # Git Bash would turn "/DAppVersion=..." into a file path; MSYS_NO_PATHCONV keeps it as an Inno Setup option.
      - run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${CASATORCH_VERSION#v}" deploy/packaging/windows/casatorch.iss'
        env: { MSYS_NO_PATHCONV: "1" }
      - name: Sign the installer
        if: steps.signing.outputs.enabled == '1'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: windows, path: dist/CasaTorch-Setup-Windows.exe }

  macos:
    needs: bundle
    runs-on: macos-latest
    # Signing (optional): a "Developer ID Installer" certificate exported as .p12 (secrets MACOS_INSTALLER_P12 =
    # its base64, MACOS_INSTALLER_P12_PASSWORD), and for notarization APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD
    # (an app-specific password from account.apple.com). The bundled Node.js is already signed and notarized by
    # the Node.js project, and CasaTorch has no other native code. Without the secrets the package is unsigned.
    # The secrets are given only to the steps that use them (not to the whole job), so no other step or action sees them.
    steps:
      - id: signing
        env: { MACOS_INSTALLER_P12: "${{ secrets.MACOS_INSTALLER_P12 }}", APPLE_ID: "${{ secrets.APPLE_ID }}" }
        run: |
          echo "p12=$([ -n "$MACOS_INSTALLER_P12" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$APPLE_ID" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: bundle }
      - run: mkdir -p dist && tar xzf bundle.tgz -C dist
      - name: Load the signing certificate
        if: steps.signing.outputs.p12 == '1'
        env:
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP=$(uuidgen)
          echo "$MACOS_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$MACOS_INSTALLER_P12_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/installer.p12"
          ID=$(security find-identity -v -p basic "$KC" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Installer certificate in MACOS_INSTALLER_P12" >&2; exit 1; }
          echo "PKG_SIGN_ID=$ID" >> "$GITHUB_ENV"
      - run: CASATORCH_VERSION=${CASATORCH_VERSION#v} deploy/packaging/macos/build-pkg.sh
      - name: Notarize
        if: env.PKG_SIGN_ID != '' && steps.signing.outputs.notarize == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/CasaTorch-macOS.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple dist/CasaTorch-macOS.pkg
          spctl --assess --type install -vv dist/CasaTorch-macOS.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos, path: dist/CasaTorch-macOS.pkg }

  publish:
    needs: [image, linux, raspberry-pi, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The release key lives in this environment's secrets (Settings > Environments > release): only tags may use it,
    # and a required reviewer can be set there (docs/GITHUB-SECURITY-SETTINGS.md).
    environment: release
    # contents: create the release; actions: read this run's artifacts; id-token + attestations: build provenance for
    # every file in the release (gh attestation verify <file> -R casatorch/casatorch).
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    env: { IMAGE: "ghcr.io/${{ github.repository_owner }}/casatorch", DIGEST: "${{ needs.image.outputs.digest }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Only what gets published, one artifact at a time, each retried - a single all-in-one download of
      # everything (including the big intermediate bundle) failed on GitHub's side.
      - name: Download the installers
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out
          for a in deb-amd64 deb-arm64 windows macos pi-image sbom-app sbom-image; do
            for try in 1 2 3 4 5; do
              rm -rf "tmp-$a"
              if gh run download "${{ github.run_id }}" -R "${{ github.repository }}" -n "$a" -D "tmp-$a"; then break; fi
              [ "$try" = 5 ] && { echo "could not download $a" >&2; exit 1; }
              echo "retrying $a in $((try * 15))s"; sleep $((try * 15))
            done
            mv "tmp-$a"/* out/ && rmdir "tmp-$a"
          done
      # The compose file people download names this release's image by its digest, so `docker compose up` runs exactly
      # the image that was built, signed and listed here (the digest is also in SHA256SUMS, under the offline signature).
      - name: Pin the image by digest
        run: |
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "no image digest from the image job" >&2; exit 1; }
          V="${CASATORCH_VERSION#v}"
          sed "s#image: ghcr.io/casatorch/casatorch:latest#image: $IMAGE:$V@$DIGEST#" deploy/downloads/casatorch-compose.yml > out/casatorch-compose.yml
          grep -q "@$DIGEST" out/casatorch-compose.yml || { echo "the compose file has no image line to pin" >&2; exit 1; }
          printf '%s@%s\n' "$IMAGE:$V" "$DIGEST" > out/casatorch-image.digest
          cp deploy/unraid/casatorch.xml out/casatorch-unraid.xml && ls -la out
      # Signed with an offline key: the Linux and Pi updater installs a release only when SHA256SUMS carries this
      # signature (checked against deploy/packaging/release-key.pub.pem, built into every package) - so even someone
      # who took over casatorch.com or the download path couldn't push an update. No key, no release.
      - name: Sign the release
        env: { KEY: "${{ secrets.CASATORCH_RELEASE_KEY }}" }
        run: |
          [ -n "$KEY" ] || { echo "CASATORCH_RELEASE_KEY is not set - not publishing an unsigned release" >&2; exit 1; }
          umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.key"
          # Every source file's checksum, so source installs (install.sh, install.ps1, the Home Assistant add-on) can
          # check a tag's files against this signed release before they build or run anything (verify-release.js).
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum -- > out/casatorch-source-files.sha256
          (cd out && sha256sum -- * > SHA256SUMS)
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.key" -rawin -in out/SHA256SUMS -out out/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release.key"
          openssl pkeyutl -verify -pubin -inkey deploy/packaging/release-key.pub.pem -rawin -in out/SHA256SUMS -sigfile out/SHA256SUMS.sig
          cat out/SHA256SUMS
      - name: Build provenance for every download
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "out/*" }
      - name: Release notes - how to check what you downloaded
        run: |
          V="${CASATORCH_VERSION#v}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ### Check your download
          **Container image:** \`$IMAGE:$V@$DIGEST\`

          \`\`\`
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity-regexp '^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://$IMAGE@$DIGEST -R ${GITHUB_REPOSITORY}
          \`\`\`
          **Installers:** \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`, and \`sha256sum -c SHA256SUMS --ignore-missing\`
          after checking SHA256SUMS.sig with the release key (see SECURITY.md › Verify your download).
          Software bills of materials (CycloneDX): casatorch-app.cdx.json, casatorch-image.cdx.json.
          EOF
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body_path: ${{ runner.temp }}/notes.md
          files: out/*
