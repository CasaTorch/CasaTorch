# Tag a version (git tag v0.3.0 && git push --tags) to publish everything people download:
#   - the multi-arch image ghcr.io/<owner>/casatorch:<version> and :latest (amd64 PCs/NAS, arm64 Raspberry Pi)
#   - installers attached to the GitHub release under fixed names, which casatorch.com/dl/<name> serves:
#     CasaTorch-Setup-Windows.exe, CasaTorch-macOS.pkg, casatorch_amd64.deb, casatorch_arm64.deb,
#     casatorch-raspberry-pi.img.xz, casatorch-compose.yml, casatorch-unraid.xml
name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write, packages: write, actions: read }
env:
  CASATORCH_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || 'v0.0.0' }}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/casatorch
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: deploy/packaging/bundle.sh dist/bundle && echo "${CASATORCH_VERSION#v}" > dist/bundle/VERSION
      - run: tar czf bundle.tgz -C dist bundle
      - uses: actions/upload-artifact@v7
        with: { name: bundle, path: bundle.tgz }

  linux:
    needs: bundle
    runs-on: ubuntu-latest
    strategy: { matrix: { arch: [amd64, arm64] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: bundle }
      - run: mkdir -p dist && tar xzf bundle.tgz -C dist
      - run: CASATORCH_VERSION=${CASATORCH_VERSION#v} deploy/packaging/linux/build-deb.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with: { name: "deb-${{ matrix.arch }}", path: "dist/casatorch_${{ matrix.arch }}.deb", compression-level: 0 }

  raspberry-pi:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: deb-arm64, path: dist }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binfmt-support parted e2fsprogs xz-utils
      - run: sudo deploy/packaging/pi/build-image.sh dist/casatorch_arm64.deb
      - uses: actions/upload-artifact@v7
        with: { name: pi-image, path: dist/casatorch-raspberry-pi.img.xz, compression-level: 0 }

  windows:
    needs: bundle
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    # Signing (optional): Microsoft Artifact Signing. Secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET;
    # variables ARTIFACT_SIGNING_ENDPOINT (e.g. https://wus2.codesigning.azure.net/), ARTIFACT_SIGNING_ACCOUNT,
    # ARTIFACT_SIGNING_PROFILE. Without them the installer is built unsigned, exactly as before.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: bundle }
      - run: mkdir -p dist && tar xzf bundle.tgz -C dist
      - run: deploy/packaging/fetch-node.sh win-x64 dist/node-win
      - run: choco install innosetup --no-progress -y
      # Git Bash would turn "/DAppVersion=..." into a file path; MSYS_NO_PATHCONV keeps it as an Inno Setup option.
      - run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${CASATORCH_VERSION#v}" deploy/packaging/windows/casatorch.iss'
        env: { MSYS_NO_PATHCONV: "1" }
      - name: Sign the installer
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: dist/CasaTorch-Setup-Windows.exe }

  macos:
    needs: bundle
    runs-on: macos-latest
    # Signing (optional): a "Developer ID Installer" certificate exported as .p12 (secrets MACOS_INSTALLER_P12 =
    # its base64, MACOS_INSTALLER_P12_PASSWORD), and for notarization APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD
    # (an app-specific password from account.apple.com). The bundled Node.js is already signed and notarized by
    # the Node.js project, and CasaTorch has no other native code. Without the secrets the package is unsigned.
    env:
      MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
      MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: bundle }
      - run: mkdir -p dist && tar xzf bundle.tgz -C dist
      - name: Load the signing certificate
        if: env.MACOS_INSTALLER_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP=$(uuidgen)
          echo "$MACOS_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$MACOS_INSTALLER_P12_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/installer.p12"
          ID=$(security find-identity -v -p basic "$KC" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Installer certificate in MACOS_INSTALLER_P12" >&2; exit 1; }
          echo "PKG_SIGN_ID=$ID" >> "$GITHUB_ENV"
      - run: CASATORCH_VERSION=${CASATORCH_VERSION#v} deploy/packaging/macos/build-pkg.sh
      - name: Notarize
        if: env.PKG_SIGN_ID != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/CasaTorch-macOS.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple dist/CasaTorch-macOS.pkg
          spctl --assess --type install -vv dist/CasaTorch-macOS.pkg
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: dist/CasaTorch-macOS.pkg }

  publish:
    needs: [image, linux, raspberry-pi, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only what gets published, one artifact at a time, each retried - a single all-in-one download of
      # everything (including the big intermediate bundle) failed on GitHub's side.
      - name: Download the installers
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out
          for a in deb-amd64 deb-arm64 windows macos pi-image; do
            for try in 1 2 3 4 5; do
              rm -rf "tmp-$a"
              if gh run download "${{ github.run_id }}" -R "${{ github.repository }}" -n "$a" -D "tmp-$a"; then break; fi
              [ "$try" = 5 ] && { echo "could not download $a" >&2; exit 1; }
              echo "retrying $a in $((try * 15))s"; sleep $((try * 15))
            done
            mv "tmp-$a"/* out/ && rmdir "tmp-$a"
          done
      - run: cp deploy/downloads/casatorch-compose.yml out/ && cp deploy/unraid/casatorch.xml out/casatorch-unraid.xml && ls -la out
      # Signed with an offline key: the Linux and Pi updater installs a release only when SHA256SUMS carries this
      # signature (checked against deploy/packaging/release-key.pub.pem, built into every package) - so even someone
      # who took over casatorch.com or the download path couldn't push an update. No key, no release.
      - name: Sign the release
        env: { KEY: "${{ secrets.CASATORCH_RELEASE_KEY }}" }
        run: |
          [ -n "$KEY" ] || { echo "CASATORCH_RELEASE_KEY is not set - not publishing an unsigned release" >&2; exit 1; }
          umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.key"
          # Every source file's checksum, so source installs (install.sh, install.ps1, the Home Assistant add-on) can
          # check a tag's files against this signed release before they build or run anything (verify-release.js).
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum -- > out/casatorch-source-files.sha256
          (cd out && sha256sum -- * > SHA256SUMS)
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release.key" -rawin -in out/SHA256SUMS -out out/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release.key"
          openssl pkeyutl -verify -pubin -inkey deploy/packaging/release-key.pub.pem -rawin -in out/SHA256SUMS -sigfile out/SHA256SUMS.sig
          cat out/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: out/*
