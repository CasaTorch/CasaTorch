# OpenSSF Scorecard: how well the project follows supply-chain practices (pinned actions, branch protection, signed
# releases, code review, token permissions...). Weekly and on pushes to main; results go to the Security tab and to
# the public Scorecard API (publish_results), which is what the badge reads.
name: Scorecard
on:
  push: { branches: [main] }
  schedule: [{ cron: "41 5 * * 1" }]
  branch_protection_rule:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # security-events: upload the results; id-token: publish them (signed with the workflow's OIDC identity).
    permissions: { contents: read, security-events: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: scorecard-results, path: results.sarif, retention-days: 5 }
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { sarif_file: results.sarif }
