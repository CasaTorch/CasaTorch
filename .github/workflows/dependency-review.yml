# Every pull request: the dependencies it adds or changes (npm, Gradle, Docker base images, Actions) are checked
# against the GitHub Advisory Database, and licenses CasaTorch can't ship under AGPL-3.0 are refused.
# A high-severity advisory in a new or changed dependency fails the check; the summary is posted on the run page.
name: Dependency review
on: { pull_request: { branches: [main] } }
permissions: { contents: read }
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          deny-licenses: SSPL-1.0, BUSL-1.1, Commons-Clause, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
          comment-summary-in-pr: never
          warn-on-openssf-scorecard-level: 3
