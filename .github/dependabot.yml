# Weekly dependency updates, grouped so a normal week is at most a couple of pull requests:
# one for all minor/patch npm updates, one for all GitHub Actions updates. Major npm updates come one by one
# (they can break things and deserve their own look). Security updates are not held to this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly, day: monday, time: "06:00" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps" }
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # werift is pinned through "overrides" in app/package.json for ring-client-api; move it by hand with Ring.
      - dependency-name: werift
      # Express 5 changes routing and error handling; move to it on purpose, with the full test suite, not by bot.
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      # three.js is served with pinned hashes (tools/make-vendor-integrity.mjs must run with every move), which
      # Dependabot can't do - move it by hand: npm i three@<v> --save-exact, then node tools/make-vendor-integrity.mjs.
      - dependency-name: three
      # Matter talks to locks and garage doors through other apps; a new 0.x line is moved on purpose, with its tests.
      - dependency-name: "@matter/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The Node.js base image, pinned to an exact patch release and its digest (tag@sha256:...). Dependabot moves both in
  # app/Dockerfile; ha-addon/build.yaml and the add-on's ARG BUILD_FROM follow by hand in the same pull request - a unit
  # test (supply-chain-unit.mjs) fails until all three name the same image. Stays on Node.js 22: a new major is deliberate.
  - package-ecosystem: docker
    directories: [/app, /ha-addon]
    schedule: { interval: weekly, day: monday, time: "06:00" }
    open-pull-requests-limit: 2
    commit-message: { prefix: "docker" }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]

  # The Android app: Gradle itself, the Android and Kotlin build plugins, and the app's libraries. Grouped into one
  # weekly pull request; the Mobile apps workflow builds it, so a bad combination shows up as a red check, not a broken app.
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule: { interval: weekly, day: monday, time: "06:00" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "android" }
    groups:
      android:
        patterns: ["*"]
    ignore:
      # New major versions of the Android build tools (Gradle, the Android plugin, Kotlin) change the build itself;
      # they are moved on purpose, not by the weekly pull request.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
