name: CasaTorch
version: "0.4.1"
slug: casatorch
description: One screen for your whole house - dashboard, wall panel, 3D home and AI assistant, with everything from Home Assistant.
url: https://github.com/casatorch/casatorch
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Host networking lets CasaTorch find Hue bridges, Shelly plugs and count devices on your network.
host_network: true
webui: "http://[HOST]:[PORT:8090]"
ports:
  8090/tcp: 8090
  8443/tcp: 8443
ports_description:
  8090/tcp: CasaTorch (dashboard, wall panel, 3D home)
  8443/tcp: CasaTorch over https at home (Settings > Secure address at home)
# Talk to Home Assistant through the Supervisor - no long-lived token to create or paste.
homeassistant_api: true
environment:
  CASATORCH_DATA_DIR: /data
  PORT: "8090"
