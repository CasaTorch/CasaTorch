# CasaTorch with Docker Compose.
#   docker compose up -d        then open http://<this machine>:8090 and follow the setup screens.
# Settings live in ./data (owner-only files). Back that folder up.
services:
  casatorch:
    image: ghcr.io/casatorch/casatorch:latest    # or build it yourself: comment this line, uncomment "build"
    # build: { context: .., dockerfile: app/Dockerfile }
    container_name: casatorch
    restart: unless-stopped
    # Linux hosts: "host" networking lets CasaTorch see your whole network (device count, Hue/Shelly on the LAN).
    # Docker Desktop (Mac/Windows): remove network_mode and use the ports mapping below instead.
    network_mode: host
    # ports: ["8090:8090"]
    environment:
      - TZ=America/New_York   # your time zone
    volumes:
      - ./data:/data
