# CasaTorch - for Synology Container Manager, QNAP Container Station, TrueNAS, Portainer or any Docker host.
# Step-by-step for your NAS: https://casatorch.com/download
# When it is running, open http://<your NAS or server address>:8090 and follow the setup screens.
# The file from casatorch.com/download names one release's image exactly (version@sha256:digest), so you run
# the image that was built, signed and published for that release - nothing else. To update, download the new file
# (or change the version and digest on the image line), then pull and redeploy.
services:
  casatorch:
    image: ghcr.io/casatorch/casatorch:latest
    container_name: casatorch
    restart: unless-stopped
    # Locked down: CasaTorch runs as its own unprivileged user (uid 1000) on a read-only system with no extra rights.
    # It starts as root only to give the settings folder to that user, then drops to it for good (never runs as root).
    # If the folder already belongs to 1000:1000, you can delete the "user" line and the "cap_add" line.
    user: "0"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]   # only for that one-time owner fix; gone once CasaTorch runs
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    # "host" lets CasaTorch find Hue bridges and other gear on your network. If your system does not
    # allow it (Docker Desktop on Mac or Windows), delete this line and use the "ports" line below.
    network_mode: host
    # ports: ["8090:8090", "8443:8443"]
    #   ...and with ports, also add  environment: { CASATORCH_LAN_IP: "192.168.1.20" }  (this computer's address)
    #   so the secure address at home points at the right place.
    volumes:
      - ./data:/data        # your settings; on TrueNAS use a full path, e.g. /mnt/tank/apps/casatorch:/data
