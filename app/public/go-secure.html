<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CasaTorch</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #070a12; color: #e8eef7; font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #26324a; border-top-color: #5eb8ff; margin: 0 auto 14px; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    p { color: #8b97ab; margin: 6px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main><div><div class="spin" aria-hidden="true"></div><b>Opening CasaTorch securely…</b><p>Switching to this home's https address.</p></div></main>
  <script src="/go-secure.js"></script>
</body>
</html>
