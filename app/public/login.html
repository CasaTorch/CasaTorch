<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg">
  <title>Sign in - HouseOS</title><link rel="stylesheet" href="setup.css"></head>
<body>
  <div class="shell" style="max-width:420px">
    <header><div class="brand">HouseOS</div></header>
    <main>
      <h1>Sign in</h1>
      <form id="f">
        <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" required></div>
        <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
        <label class="field check"><input id="r" type="checkbox"> Keep this screen signed in (wall panels)</label>
        <p class="err" id="msg" role="alert"></p>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </main>
  </div>
  <script src="login.js"></script>
</body>
</html>
