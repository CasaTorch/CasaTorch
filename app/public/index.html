<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <script>try{var t=localStorage.getItem("casatorch-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>CasaTorch</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="statusbar" hidden></header>
  <div class="shell">
    <aside class="rail">
      <a class="logo" href="#home" aria-label="CasaTorch home"><svg width="26" height="26" viewBox="8 8 48 48" aria-hidden="true"><defs><linearGradient id="ct-rail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs><path d="M44 18.5A19 19 0 1 0 44 45.5" fill="none" stroke="url(#ct-rail)" stroke-width="7.5" stroke-linecap="round"/><circle cx="45" cy="32" r="6.5" fill="#fbbf24"/></svg></a>
      <nav class="nav" aria-label="Sections"></nav>
    </aside>
    <main class="main">
      <div id="banner" hidden></div>
      <div class="top">
        <div><h1 id="title">Home</h1><div class="sub" id="subtitle"></div></div>
        <span class="grow"></span>
        <div class="row" id="actions"></div>
        <span class="clock" id="clock"></span>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
