<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HouseOS</title>
  <style>
    :root { --bg: #0e1116; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --accent: #3b82f6; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid #222; flex-wrap: wrap; }
    .brand { font-weight: 700; font-size: 18px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button { background: none; border: 1px solid #30363d; color: var(--text); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    .tabs button.on { background: var(--accent); border-color: transparent; }
    #demo { background: #3b2f00; color: #f5d76e; padding: 6px 16px; font-size: 13px; }
    main { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 10px; padding: 12px 14px; margin: 8px 0; }
    .title { font-weight: 600; } .muted { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div id="demo" hidden>Demo mode: sample data, no real house connected.</div>
  <header><span class="brand">HouseOS</span><nav class="tabs"></nav></header>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
