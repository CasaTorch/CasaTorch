<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg">
  <title>CasaTorch - 3D Home</title>
  <link rel="stylesheet" href="floorplan.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="20" height="20" style="vertical-align:-4px;margin-right:6px"><span class="brandtx">CasaTorch</span></a>
    <div class="seg" id="modeSeg"><button type="button" data-mode="view" class="on">3D</button><button type="button" data-mode="edit">Edit</button></div>
    <div class="totals" id="totals"></div>
    <span class="spacer"></span>
    <div id="themeSeg"></div>
    <button type="button" id="guideBtn" class="tog">Help</button>
  </header>
  <nav class="chips" id="chips" hidden></nav>
  <div class="stage"><div id="view"></div></div>
  <aside id="left" class="panel" hidden></aside>
  <aside id="side" class="panel" hidden></aside>
  <footer class="tools" id="tools" hidden></footer>
  <div id="modal" hidden></div>
  <script src="i18n.js"></script>
  <script src="floorplan-compat.js"></script><!-- checks the browser can show the 3D home, then starts floorplan.js -->
</body>
</html>
